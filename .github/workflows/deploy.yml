name: Deploy to GitHub Pages

# Publishes the landing page and dashboard on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_GRID_TOKEN_ADDRESS: ${{ vars.VITE_GRID_TOKEN_ADDRESS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
